distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# AGP 8.1.4 需要 Gradle 8.0+，官方推荐 8.2；不要用 Gradle 9.x（AGP 8.x 与 Gradle 9.6 不兼容）
# 国内网络访问 services.gradle.org 常超时，这里用腾讯云镜像（目录结构与官方一致）
# 若镜像不可用，可换成：
#   https\://mirrors.aliyun.com/gradle/gradle-8.2-bin.zip
#   https\://mirrors.huaweicloud.com/gradle/gradle-8.2-bin.zip
#   https\://services.gradle.org/distributions/gradle-8.2-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip
networkTimeout=60000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
