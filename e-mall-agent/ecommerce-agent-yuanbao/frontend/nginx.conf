server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/py/ { proxy_pass http://backend-python:8000/; proxy_buffering off; proxy_read_timeout 300s; }
  location /api/java/ { proxy_pass http://backend-java:8080/; proxy_buffering off; proxy_read_timeout 300s; }
  location /api/ { proxy_pass http://backend-python:8000/; proxy_buffering off; proxy_read_timeout 300s; }
}
