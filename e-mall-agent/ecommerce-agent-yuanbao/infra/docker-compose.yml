name: ecommerce-agent

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # ---------------------------------------------------------------- 前端（两套后端共用）
  frontend:
    build: { context: ../frontend, dockerfile: Dockerfile }
    container_name: agent-frontend
    ports: ["8081:80"]
    depends_on: [backend-python, backend-java]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- 双后端
  backend-python:
    build: { context: ../backend-python, dockerfile: Dockerfile }
    container_name: agent-backend-python
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      USE_EXTERNAL_INFRA: "true"
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MILVUS_HOST: milvus-standalone
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      milvus-standalone: { condition: service_started }
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend-java:
    build: { context: ../backend-java, dockerfile: Dockerfile }
    container_name: agent-backend-java
    ports: ["8080:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MILVUS_HOST: milvus-standalone
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- MySQL
  mysql:
    image: mysql:8.0
    container_name: agent-mysql
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pwd}
      MYSQL_DATABASE: ${MYSQL_DB:-ecommerce_agent}
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent_pwd}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_pwd}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ---------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # ---------------------------------------------------------------- RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: agent-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-agent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-agent_pwd}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ---------------------------------------------------------------- Milvus standalone
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: agent-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes: ["etcd_data:/etcd"]
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: agent-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/minio_data"]
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  milvus-standalone:
    image: milvusdb/milvus:v2.5.4
    container_name: agent-milvus
    ports: ["19530:19530", "9091:9091"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MQ_TYPE: rocksmq
    volumes: ["milvus_data:/var/lib/milvus"]
    networks:
      default:
        aliases: [milvus, milvus-standalone]
    command: ["milvus", "run", "standalone"]
    depends_on: [etcd, minio]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 5s
      retries: 15
    logging: *default-logging

  # ---------------------------------------------------------------- 可观测
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: agent-otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: agent-prometheus
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [otel-collector]
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  rabbit_data:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  default: { name: agent-net }
