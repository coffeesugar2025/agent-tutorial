# 独立部署参考（完整 http 块，适合作为 nginx 主配置）。
# compose 并不加载本文件：frontend 镜像使用 frontend/nginx.conf（server 块，挂到
# /etc/nginx/conf.d/default.conf）。两者不要混用，否则重复 http 块会导致 nginx 启动失败。
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  upstream py_backend { server backend-python:8000; }
  upstream java_backend { server backend-java:8080; }
  server {
    listen 80;
    root /usr/share/nginx/html; index index.html;
    location / { try_files $uri $uri/ /index.html; }
    # 前端用 /api/py/* 与 /api/java/* 显式选择后端；默认 /api/* 走 python
    location /api/py/ { proxy_pass http://py_backend/; proxy_set_header Host $host;
      proxy_buffering off; proxy_read_timeout 300s; }
    location /api/java/ { proxy_pass http://java_backend/; proxy_set_header Host $host;
      proxy_buffering off; proxy_read_timeout 300s; }
    location /api/ { proxy_pass http://py_backend/; proxy_set_header Host $host;
      proxy_buffering off; proxy_read_timeout 300s; }
  }
}
