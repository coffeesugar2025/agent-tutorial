# =============================================================================
# 星图商城 · 电商智能体平台  前端静态站点 + API 反向代理
#
# 挂载位置：/etc/nginx/conf.d/default.conf （http 上下文，可直接写 upstream）
#
# 默认上游：backend_python（FastAPI，8000）
# 切换 Java：见文件末尾「切流方案」，改 1 处 proxy_pass 或 upstream server 即可。
#
# 为什么 SSE 要单独 location：
#   nginx 默认按 4k/8k 缓冲上游响应，会把增量 token 攒成一坨再吐给浏览器，
#   表现为“打字机效果消失、首字延迟等于整段生成时间”。必须关闭 proxy_buffering。
# =============================================================================

upstream backend_python {
    # max_fails/fail_timeout：单实例故障时 10s 内快速失败，避免请求打穿
    server backend-python:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream backend_java {
    server backend-java:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 知识库上传（pdf/docx）需要放大请求体上限
    client_max_body_size 50m;
    client_body_timeout 60s;

    # 基础安全响应头（注意：location 内一旦自带 add_header，则不继承此处配置）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # 访问日志带上游耗时，便于排查慢请求
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # 健康检查（compose healthcheck 与外部 LB 共用）
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # -------------------------------------------------------------------------
    # 静态资源：带 hash 的产物长缓存
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # ★ SSE 流式对话（必须独立，超时必须 ≥ 后端 TASK_TIMEOUT + 缓冲）
    # -------------------------------------------------------------------------
    location = /api/v1/chat/stream {
        proxy_pass http://backend_python;      # ← 切换 Java 改这一行为 backend_java

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # --- SSE 关键四件套：关缓冲、关缓存、长超时、清空 Connection ---
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 若本 nginx 前面还有一层代理，靠这个头让它也别缓冲
        add_header X-Accel-Buffering no;
        add_header X-Backend python always;

        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
    }

    # -------------------------------------------------------------------------
    # 普通 API：转发到同一上游；同样关闭缓冲，避免未来新增流式接口踩坑
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_python;      # ← 切换 Java 改这一行为 backend_java

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-Backend python always;
    }

    # Prometheus 抓取口：默认只在内网暴露，需要时取消注释并加 allow 白名单
    # location = /metrics {
    #     allow 172.16.0.0/12;
    #     deny all;
    #     proxy_pass http://backend_python;
    # }

    # -------------------------------------------------------------------------
    # SPA 前端路由
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # -------------------------------------------------------------------------
    # 后端不可用时的统一错误信封（与 docs/03 错误码一致，避免前端拿到 HTML）
    # -------------------------------------------------------------------------
    # 只兜 502/504（连接不上、上游超时）；业务 500/503 由后端信封原样透传
    error_page 502 504 = @backend_down;

    location @backend_down {
        default_type application/json;
        return 503 '{"code":50300,"message":"backend unavailable","data":null,"traceId":""}';
    }
}

# =============================================================================
# 切流方案（按推荐顺序）
#
# 1) 最快：把上面两处 `proxy_pass http://backend_python;` 改成 `http://backend_java;`
#    docker compose exec frontend nginx -t && docker compose exec frontend nginx -s reload
#
# 2) 最小改动：交换 upstream 内部的 server 行
#      upstream backend_python {
#          server backend-java:8080 max_fails=3 fail_timeout=10s;
#          keepalive 32;
#      }
#    好处是前端与后端 API base 都不动，回滚只是再换回来。
#
# 3) 灰度：按 header / cookie 分流（需把 proxy_pass 改为变量才会每次解析 DNS）
#      split_clients "${request_id}" $backend_pool {
#          10%  backend_java;
#          *    backend_python;
#      }
#      proxy_pass http://$backend_pool;
#    split_clients 需要 nginx 内置 request_id 模块：`set $request_id $request_id;`
#
# 4) 前端设置页切换：前端把 baseURL 指到 http://<host>:8080，绕过 nginx 直连 Java。
#    仅用于联调对比，生产不要长期保留（会绕过统一的 CORS/限流/日志）。
# =============================================================================
