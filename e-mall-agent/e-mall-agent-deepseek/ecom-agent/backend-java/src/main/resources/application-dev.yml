# 开发环境：本地容器（docker-compose）直连，全链路 Mock 可离线跑通。
# 用法：LLM_PRIMARY=mock EMBEDDING_PROVIDER=hash MQ_ENABLED=false mvn spring-boot:run
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ecom_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}

app:
  env: dev
  llm:
    # 本地无 Key 时建议 LLM_PRIMARY=mock
    providers:
      deepseek:
        log-requests: true
      ollama:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}/v1
  milvus:
    host: ${MILVUS_HOST:localhost}

logging:
  level:
    com.xingtu.agent: DEBUG
    org.springframework.jdbc.core: INFO
