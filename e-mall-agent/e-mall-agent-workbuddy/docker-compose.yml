# 电商智能体全栈编排（Compose Spec，兼容 docker compose v2 / docker-compose v1.29+）
# 用法：cp .env.example .env && docker compose up -d --build
name: ecom-agent

networks:
  ecom-net:
    driver: bridge
    name: ecom-agent-net

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  etcd-data:
  minio-data:

services:
  # ---------------- 基础设施 ----------------
  mysql:
    image: mysql:8.0
    container_name: ecom-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecom_agent}
      MYSQL_USER: ${MYSQL_USER:-ecom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表 / 种子数据脚本（只读挂载）
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [ecom-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    # 空密码时 Redis 自动关闭鉴权，便于本地 demo
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks: [ecom-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecom-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecom}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [ecom-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ecom-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=${ETCD_NAME:-etcd0}
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:${ETCD_CLIENT_PORT:-2379}
      - --advertise-client-urls=http://etcd:${ETCD_CLIENT_PORT:-2379}
      - --listen-peer-urls=http://0.0.0.0:${ETCD_PEER_PORT:-2380}
      - --initial-advertise-peer-urls=http://etcd:${ETCD_PEER_PORT:-2380}
      - --initial-cluster=${ETCD_NAME:-etcd0}=http://etcd:${ETCD_PEER_PORT:-2380}
      - --initial-cluster-state=new
      - --initial-cluster-token=ecom-etcd-cluster
    volumes:
      - etcd-data:/etcd-data
    networks: [ecom-net]
    healthcheck:
      test: ["CMD-SHELL", "ETCDCTL_API=3 etcdctl --endpoints=http://127.0.0.1:${ETCD_CLIENT_PORT:-2379} endpoint health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: ecom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks: [ecom-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: ecom-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:${ETCD_CLIENT_PORT:-2379}
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    networks: [ecom-net]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9091/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------- 应用服务 ----------------
  backend-python:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom-backend-python
    restart: unless-stopped
    environment:
      ECOM_DEBUG: ${ECOM_DEBUG:-false}
      ECOM_LLM_PROVIDER: ${ECOM_LLM_PROVIDER:-offline}
      ECOM_LLM_MODEL: ${ECOM_LLM_MODEL:-gpt-4o-mini}
      ECOM_OPENAI_API_KEY: ${ECOM_OPENAI_API_KEY:-}
      ECOM_MCP_MODE: ${ECOM_MCP_MODE:-local}
      ECOM_SECRET_KEY: ${ECOM_SECRET_KEY:-change-me-in-production}
      ECOM_CONTEXT_MAX_CHARS: ${ECOM_CONTEXT_MAX_CHARS:-3200}
      ECOM_CONTEXT_RECENT_MESSAGES: ${ECOM_CONTEXT_RECENT_MESSAGES:-8}
      ECOM_RAG_TOP_K: ${ECOM_RAG_TOP_K:-3}
      # 基础设施连接串（未配置或缺少驱动时适配器自动回退到内存实现）
      ECOM_MYSQL_URL: ${ECOM_MYSQL_URL:-}
      ECOM_REDIS_URL: ${ECOM_REDIS_URL:-}
      ECOM_RABBITMQ_URL: ${ECOM_RABBITMQ_URL:-}
      ECOM_MILVUS_URL: ${ECOM_MILVUS_URL:-}
      ECOM_MILVUS_TOKEN: ${ECOM_MILVUS_TOKEN:-}
      # 多模型网关：offline 可单独使用；启用 deepseek/qwen 时填入对应 Key
      ECOM_LLM_PROVIDERS: ${ECOM_LLM_PROVIDERS:-offline}
      ECOM_LLM_DEFAULT_PROVIDER: ${ECOM_LLM_DEFAULT_PROVIDER:-offline}
      ECOM_DEEPSEEK_API_KEY: ${ECOM_DEEPSEEK_API_KEY:-}
      ECOM_QWEN_API_KEY: ${ECOM_QWEN_API_KEY:-}
      ECOM_DEEPSEEK_BASE_URL: ${ECOM_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      ECOM_QWEN_BASE_URL: ${ECOM_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    ports:
      - "${PYTHON_BACKEND_PORT:-8000}:8000"
    networks: [ecom-net]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend-java:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: ecom-backend-java
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # 使用 java-backend/src/main/resources/application.yml 中的应用级变量名，
      # 避免与 spring.*  relaxed binding 覆盖产生“URL 是 MySQL、driver 仍是 H2”的错配。
      MYSQL_URL: ${MYSQL_URL:-}
      DB_DRIVER: ${DB_DRIVER:-com.mysql.cj.jdbc.Driver}
      MYSQL_USER: ${MYSQL_USER:-ecom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MEMORY_ENABLED: ${REDIS_MEMORY_ENABLED:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ecom}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      EVENT_PUBLISH_ENABLED: ${EVENT_PUBLISH_ENABLED:-true}
      MILVUS_ENABLED: ${MILVUS_ENABLED:-true}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      LANGCHAIN4J_OPEN_AI_API_KEY: ${LANGCHAIN4J_OPEN_AI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    ports:
      - "${JAVA_BACKEND_PORT:-8080}:8080"
    networks: [ecom-net]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      # 兼容 curl / wget 两种基础镜像，并同时支持 actuator 与 /api/health 两种端点
      test: ["CMD-SHELL", "for p in /actuator/health /api/health; do curl -fsS \"http://127.0.0.1:8080$$p\" >/dev/null 2>&1 && exit 0; wget -qO- \"http://127.0.0.1:8080$$p\" >/dev/null 2>&1 && exit 0; done; exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 构建期无需注入后端地址，网关地址在容器运行时由 envsubst 生成
        VITE_API_BASE: /api
    container_name: ecom-frontend
    restart: unless-stopped
    environment:
      # nginx 模板在容器启动时用该值替换 ${UPSTREAM_BACKEND}
      # 切换 Java 后端：UPSTREAM_BACKEND=backend-java:8080
      UPSTREAM_BACKEND: ${UPSTREAM_BACKEND:-backend-python:8000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks: [ecom-net]
    depends_on:
      backend-python:
        condition: service_healthy
      backend-java:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
